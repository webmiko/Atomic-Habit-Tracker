<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Кабинет — Atomic Habit Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/custom.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
      <div class="container">
        <a class="navbar-brand" href="cabinet.html">Atomic Habits</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="#my" data-section="my">Мои</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#community" data-section="community">Сообщество</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#templates" data-section="templates">Каталог</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#settings" data-section="settings">Настройки</a>
            </li>
          </ul>
          <button class="btn btn-outline-light btn-sm" id="btn-logout" type="button">
            Выйти
          </button>
        </div>
      </div>
    </nav>

    <main class="container pb-5">
      <div id="global-alert" class="alert alert-danger d-none" role="alert"></div>

      <section id="panel-my" class="section-panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h4 mb-0">Мои привычки</h1>
          <button class="btn btn-success btn-sm" id="btn-add-habit" type="button">
            Добавить
          </button>
        </div>
        <div id="my-list" class="row g-3"></div>
        <nav id="my-pagination" class="mt-3"></nav>
      </section>

      <section id="panel-community" class="section-panel">
        <h1 class="h4 mb-3">Сообщество</h1>
        <p class="form-hint">Публичные привычки других участников</p>
        <div id="community-list" class="row g-3"></div>
        <nav id="community-pagination" class="mt-3"></nav>
      </section>

      <section id="panel-templates" class="section-panel">
        <h1 class="h4 mb-3">Каталог шаблонов</h1>
        <p class="form-hint">Готовые связки из 16 полезных и 13 приятных шаблонов</p>
        <div id="templates-list" class="row g-3"></div>
        <nav id="templates-pagination" class="mt-3"></nav>
      </section>

      <section id="panel-settings" class="section-panel">
        <h1 class="h4 mb-3">Настройки</h1>
        <div class="row g-4">
          <div class="col-12 col-lg-6">
            <div class="card">
              <div class="card-body">
                <h2 class="h6">Профиль</h2>
                <form id="settings-form">
                  <div class="mb-2">
                    <label class="form-label">Email</label>
                    <input class="form-control" id="settings-email" type="email" disabled />
                  </div>
                  <div class="mb-2">
                    <label class="form-label">Имя в ленте</label>
                    <input class="form-control" id="settings-name" type="text" />
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" id="settings-email-notify" type="checkbox" />
                    <label class="form-check-label" for="settings-email-notify">
                      Оповещения по email
                    </label>
                  </div>
                  <div class="form-check mb-3">
                    <input class="form-check-input" id="settings-tg-notify" type="checkbox" />
                    <label class="form-check-label" for="settings-tg-notify">
                      Оповещения в Telegram
                    </label>
                  </div>
                  <button class="btn btn-success btn-sm" type="submit">Сохранить</button>
                </form>
              </div>
            </div>
          </div>
          <div class="col-12 col-lg-6">
            <div class="card">
              <div class="card-body">
                <h2 class="h6">Telegram</h2>
                <p class="form-hint mb-2">
                  Статус:
                  <span id="tg-status" class="fw-semibold">—</span>
                </p>
                <button class="btn btn-outline-success btn-sm mb-2" id="btn-tg-code" type="button">
                  Получить код привязки
                </button>
                <div id="tg-code-box" class="d-none">
                  <p class="mb-1">Отправьте боту:</p>
                  <p class="telegram-code mb-1" id="tg-code-text"></p>
                  <p class="form-hint" id="tg-code-expires"></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="modal fade" id="habit-modal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="habit-form">
            <div class="modal-header">
              <h2 class="modal-title h5" id="habit-modal-title">Привычка</h2>
              <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input id="habit-id" type="hidden" />
              <div class="row g-2">
                <div class="col-12">
                  <label class="form-label">Действие</label>
                  <input class="form-control" id="habit-action" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Место</label>
                  <input class="form-control" id="habit-place" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Время</label>
                  <input class="form-control" id="habit-time" type="time" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Длительность (сек)</label>
                  <input
                    class="form-control"
                    id="habit-duration"
                    type="number"
                    min="1"
                    max="120"
                    required
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Периодичность (дней)</label>
                  <input
                    class="form-control"
                    id="habit-periodicity"
                    type="number"
                    min="1"
                    max="7"
                    value="1"
                    required
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Тип</label>
                  <select class="form-select" id="habit-pleasant">
                    <option value="false">Полезная</option>
                    <option value="true">Приятная</option>
                  </select>
                </div>
                <div class="col-md-6" id="reward-group">
                  <label class="form-label">Награда (текст)</label>
                  <input class="form-control" id="habit-reward" />
                </div>
                <div class="col-md-6" id="related-group">
                  <label class="form-label">Связанная приятная</label>
                  <select class="form-select" id="habit-related">
                    <option value="">—</option>
                  </select>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" id="habit-public" type="checkbox" />
                    <label class="form-check-label" for="habit-public">
                      Показывать в сообществе
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">
                Отмена
              </button>
              <button class="btn btn-success" type="submit">Сохранить</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="public-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5">Публичная привычка</h2>
            <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="public-modal-body"></div>
          <div class="modal-footer">
            <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">
              Закрыть
            </button>
            <button class="btn btn-success" id="btn-copy-public" type="button">
              Добавить к себе
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cabinet.js"></script>
  </body>
</html>
